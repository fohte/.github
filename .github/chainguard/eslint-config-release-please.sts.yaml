issuer: https://token.actions.githubusercontent.com
subject_pattern: ^repo:fohte(@[0-9]+)?/eslint-config(@[0-9]+)?:ref:refs/heads/master$
claim_pattern:
  job_workflow_ref: ^fohte/eslint-config/\.github/workflows/release-please\.yml@[^@]+$
repositories:
  - eslint-config
permissions:
  contents: write
  pull_requests: write
