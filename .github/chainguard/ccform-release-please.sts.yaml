issuer: https://token.actions.githubusercontent.com
subject_pattern: ^repo:fohte(@[0-9]+)?/ccform(@[0-9]+)?:ref:refs/heads/main$
claim_pattern:
  job_workflow_ref: ^fohte/ccform/\.github/workflows/release-please\.yml@[^@]+$
repositories:
  - ccform
permissions:
  contents: write
  pull_requests: write
