issuer: https://token.actions.githubusercontent.com
subject_pattern: ^repo:fohte(@[0-9]+)?/ddr-score-manager(@[0-9]+)?:ref:refs/heads/main$
claim_pattern:
  job_workflow_ref: ^fohte/ddr-score-manager/\.github/workflows/boilerplate-update\.yml@[^@]+$
repositories:
  - ddr-score-manager
permissions:
  contents: write
  pull_requests: write
  workflows: write
