issuer: https://token.actions.githubusercontent.com
subject_pattern: ^repo:fohte(@[0-9]+)?/service-kit(@[0-9]+)?:ref:refs/heads/main$
claim_pattern:
  job_workflow_ref: ^fohte/service-kit/\.github/workflows/release-please\.yml@[^@]+$
repositories:
  - service-kit
permissions:
  contents: write
  pull_requests: write
