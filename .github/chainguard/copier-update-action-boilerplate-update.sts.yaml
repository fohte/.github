issuer: https://token.actions.githubusercontent.com
subject_pattern: ^repo:fohte(@[0-9]+)?/copier-update-action(@[0-9]+)?:ref:refs/heads/main$
claim_pattern:
  job_workflow_ref: ^fohte/copier-update-action/\.github/workflows/boilerplate-update\.yml@[^@]+$
repositories:
  - copier-update-action
permissions:
  contents: write
  pull_requests: write
  workflows: write
