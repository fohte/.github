issuer: https://token.actions.githubusercontent.com
subject_pattern: ^repo:fohte(@[0-9]+)?/renovate-config(@[0-9]+)?:pull_request$
claim_pattern:
  job_workflow_ref: ^fohte/renovate-config/\.github/workflows/renovate-copier\.yml@[^@]+$
repositories:
  - renovate-config
