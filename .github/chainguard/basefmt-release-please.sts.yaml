issuer: https://token.actions.githubusercontent.com
subject_pattern: ^repo:fohte(@[0-9]+)?/basefmt(@[0-9]+)?:ref:refs/heads/master$
claim_pattern:
  job_workflow_ref: ^fohte/basefmt/\.github/workflows/release-please\.yml@[^@]+$
repositories:
  - basefmt
permissions:
  contents: write
  pull_requests: write
